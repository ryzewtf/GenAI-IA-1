    vllm: {model_id: Ryze242005/DeepSeek-V2-Lite-w4a16-gptq, quant: gptq_int4, tensor_parallel: 1, gpu_memory_utilization: 0.90, router_suffix: .mlp.gate, experts_suffix: .mlp.experts, model_sha256: null}
    router_dtype: F32
    node_names: {logits: ffn_moe_probs-%d, logits_biased: null, topk: ffn_moe_topk-%d, router_input: ffn_norm-%d}
