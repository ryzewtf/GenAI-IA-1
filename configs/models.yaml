    gguf: {repo: null, kaggle: ryzewtf/moe-panel/gguf/olmoe-0125-instruct, file: olmoe-0125-instruct-Q4_K_M.gguf, sha256: c2502f0d9e5ec056c6f5ba87a9fa14aed3cfa7833811a70e9393318b8a86ca7c, size_bytes: 4213512960}
    # vLLM engine: arch identical to olmoe-0125 (OlmoeForCausalLM, P1/P3-proven). fp16 fits one T4
    # at util 0.95 (~12.9 GiB). model_sha256 null → collector resolves the HF revision sha on first
    # real collect, then pin it here.
    vllm: {model_id: allenai/OLMoE-1B-7B-0125-Instruct, quant: fp16, tensor_parallel: 1, gpu_memory_utilization: 0.95, router_suffix: .mlp.gate, experts_suffix: .mlp.experts, model_sha256: null}
    # VERIFIED T1.2 — GATE PASSED. `python -m src.capture.router_audit` found 16 ffn_gate_inp
