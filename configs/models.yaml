# Model panel. Values marked `# VERIFIED §1.4` were read from the model's own config.json or
# modeling code during planning. Fields set to `null` are filled by a specific task and MUST NOT
# be guessed — the task ID that populates each is named in the comment.
#
#   T1.1 -> gguf.*, revision, checkpoint_status
#   T1.2 -> router_dtype
#   T1.3 -> confirms every VERIFIED field against the live config.json
#   T1.4 -> node_names.*, logit_tensor_used
#
# node_names / logit_tensor_used (T1.4). Read from llama.cpp master build_moe_ffn, the routing chain
# is:  ffn_moe_logits -> [ffn_moe_logits_biased] -> ffn_moe_probs -> [ffn_moe_probs_biased] ->
#      [ffn_moe_probs_masked] -> ggml_argsort_top_k -> ffn_moe_topk
# `logit_tensor_used` must name the LAST node present, because that is the tensor top-k actually
# consumed and therefore the only one whose k vs k+1 margin explains a flip (§1.6, T8.2). Softmax
# and sigmoid are monotonic so they do not change the ORDER, but ffn_moe_probs_biased and
# ffn_moe_probs_masked do. Templates carry one "%d" for the model layer index; generate the harness
# spec with `python -m src.capture.nodespec --model <key>`.
#
# Config-key gotcha (T1.3): key names are NOT uniform across the panel. Use `config_keys` below,
# never a single generic assertion loop — that KeyErrors on DeepSeek and Gemma.

schema_version: 1

defaults:
  quant: Q4_K_M
  # llama.cpp never quantizes ffn_gate_inp.weight — explicit NAME rule in src/llama-quant.cpp,
  # not a shape rule. "Not quantized" == inherits the SOURCE dtype, which is why T1.2 exists.
  router_quantized: false

models:

  olmoe-0125:
    hf_repo: allenai/OLMoE-1B-7B-0125
    revision: null                      # T1.1
    checkpoint_status: base
    role: [pair_g, pair_a, primary, pipeline_validator, scale_run, precision_ladder]
    n_experts: 64                       # VERIFIED §1.4
    top_k: 8                            # VERIFIED §1.4
    n_moe_layers: 16                    # VERIFIED §1.4
    moe_layer_offset: 0                 # all layers are MoE
    hidden_dim: 2048                    # VERIFIED §1.4
    post_topk: none                     # norm_topk_prob: false
    aux_loss: {key: router_aux_loss_coef, value: 0.01}
    shared_experts: 0
    vocab_size: 50304
    moe_intermediate_size: 1024          # VERIFIED T1.3 — "high granularity": 64 small experts
    max_position_embeddings: 4096        # VERIFIED T1.3
    first_k_dense_replace: 0             # every layer is MoE; the layer map is the identity
    moe_layer_freq: 1
    has_router_bias: false               # VERIFIED T1.3 — no gate_inp_b
    has_expert_selection_bias: false     # VERIFIED T1.3 — no e_score_correction_bias
    n_expert_groups: 1                   # VERIFIED T1.3 — no group routing
    multimodal: false
    router_module_path: model.layers.{i}.mlp.gate
    approx_size_gb: 4.2
    device_plan: {n_gpu: 1, split_mode: layer, tensor_split: null}
    config_keys: {experts: num_experts, top_k: num_experts_per_tok, aux_loss: router_aux_loss_coef, nesting: null}
    gguf: {repo: null, kaggle: ryzewtf/moe-panel/gguf/olmoe-0125, file: olmoe-0125-Q4_K_M.gguf, sha256: 57c420a91615c999acec2ae527244fb43aac04029a4daabda8bd5c85b5e9e10b, size_bytes: 4213512320}
    # vLLM engine (P1-proven TP=1). router/experts suffixes CONFIRMED on-box (Cell 4, 2026-09-13):
    # 16 model.layers.{i}.mlp.gate (ReplicatedLinear) + .mlp.experts (FusedMoE). fp16 fits one T4 at
    # util 0.95 (7B fp16 weights ~12.9 GiB). model_sha256 is the weights identity for the manifest;
    # null until the T1.1-equivalent step fills it (the P3 notebook resolves the HF revision sha).
    # model_sha256 PINNED from the P3 run (HF revision sha, resolved 2026-09-13) so the manifest
    # weights identity is frozen and reproducible; the collector uses a set value as-is (no re-resolve).
    vllm: {model_id: allenai/OLMoE-1B-7B-0125, quant: fp16, tensor_parallel: 1, gpu_memory_utilization: 0.95, router_suffix: .mlp.gate, experts_suffix: .mlp.experts, model_sha256: 9b0c1aa87e34a20052389dce1f0cf01da783f654}
    router_dtype: F32
    node_names: {logits: ffn_moe_probs-%d, logits_biased: null, topk: ffn_moe_topk-%d, router_input: ffn_norm-%d}
    logit_tensor_used: ffn_moe_probs

