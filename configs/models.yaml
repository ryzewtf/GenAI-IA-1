  gpt-oss-20b:
    hf_repo: openai/gpt-oss-20b
    revision: null
    checkpoint_status: instruct          # OpenAI released no base checkpoint
    role: [pair_g, primary]
    n_experts: 32                        # VERIFIED §1.4
    top_k: 4                             # VERIFIED §1.4
    n_moe_layers: 24                     # VERIFIED §1.4
    moe_layer_offset: 0
    hidden_dim: 2880                     # VERIFIED §1.4
    post_topk: softmax_over_selected
    aux_loss: {key: router_aux_loss_coef, value: 0.9}   # 900x the rest of the panel — T9.4 confound
    shared_experts: 0
    vocab_size: 201088
    approx_size_gb: 12
    quant: MXFP4                         # PANEL EXCEPTION: native, do NOT requantize
    # THE critical model for §1.6. GPT-OSS supplies gate_inp_b, so selection runs on
    # ffn_moe_logits_biased. Recomputing top-k from the unbiased tensor yields sets the model
    # never routed, in half of the headline pair. T1.4's bias sanity check is the positive test.
    has_router_bias: true                # VERIFIED §1.6
    device_plan: {n_gpu: 1, split_mode: layer, tensor_split: null}
    config_keys: {experts: num_local_experts, top_k: num_experts_per_tok, aux_loss: router_aux_loss_coef, nesting: null}
    gguf: {repo: null, kaggle: ryzewtf/moe-panel/gguf/gpt-oss-20b, file: gpt-oss-20b-F16.gguf, sha256: 87062115cda40f04be2e213e41de1239fc6acf23105a10065312892cd2d0627c, size_bytes: 13792638656}
    # RESOLVED — this entry used to name a third-party Q4_K_M build, which conflicted with the
    # frozen decision in plan §0b ("GPT-OSS: native MXFP4, do not requantize") because requantizing
    # MXFP4 to Q4_K_M is a lossy transform of an already-lossy format. The file recorded here is
    # our own conversion and is NOT a requantization: convert_hf_to_gguf detects the MXFP4 source
    # (`_is_mxfp4`), promotes the file type to MOSTLY_MXFP4_MOE, and repacks the expert tensors
    # losslessly; the quantize step is skipped entirely, which is why the name says F16 while the
    # experts stay MXFP4. The three consequences that flag listed are therefore gone: §1.6's router
    # bias and T3.2's PyTorch cross-check now compare against the weights as released. T8.4 still
    # exempts this checkpoint from the precision ladder — there is no uncompressed reference to
    # ladder against — but that is a property of the release, not of anything we did to it.
    # vLLM engine (Tier 2). In vLLM the router is self.mlp.router = nn.Linear(hidden, 32, bias=True):
    # `g = router(x); experts(router_logits=g)`, so the captured router OUTPUT already contains the
    # additive bias (there is no separate gate_inp_b tensor). router_bias_in_output: true tells
    # gating_from_config to use the captured logits as-is; the SelectionMismatch gate (recompute vs
    # vLLM's select_experts, both over g) is the on-box proof. Suffix is .mlp.router (NOT .mlp.gate).
    # quant mxfp4 is the native release; MXFP4-on-T4 (sm_75) is UNPROVEN — run notebooks/gptoss_probe
    # (a cheap single-doc T4 load) before any full run. model_sha256 null → collector resolves it.
    vllm: {model_id: openai/gpt-oss-20b, quant: mxfp4, tensor_parallel: 1, gpu_memory_utilization: 0.90, router_suffix: .mlp.router, experts_suffix: .mlp.experts, router_bias_in_output: true, model_sha256: null}
    router_dtype: F32
    node_names: {logits: ffn_moe_probs-%d, logits_biased: null, topk: ffn_moe_topk-%d, router_input: attn_post_norm-%d}
    logit_tensor_used: ffn_moe_probs
    notes: >
      transformers MXFP4 gates at compute capability >= (7,5); a T4 is exactly (7,5), so the
      T3.2 cross-validation is an open empirical question, not a known blocker. Needs Triton
      >= 3.4 and the `kernels` package (checked in T0.1); without them it dequantizes to bf16
      (~40 GB) and fails.

