  gemma-4-26b-a4b:
    hf_repo: google/gemma-4-26B-A4B
    # O6 CLOSED: the repo resolves. Released 2026-04-03 under Apache-2.0; 25.2B total / 3.8B active,
    # 30 layers, 128 routed experts, 8 active, vocab 262K, 256K context, sliding window 1024.
    # Pair T does not need a substitute.
    availability: verified
    release_date: 2026-04-03
    license: apache-2.0
    sliding_window: 1024                 # attention only; irrelevant to routing capture at -c 2048
    revision: null
    checkpoint_status: instruct          # T1.1 / O5 — default `-it` is the instruction-tuned checkpoint (no base GGUF is published)
    role: [pair_t, primary, shared_expert_panel]
    n_experts: 128                       # VERIFIED §1.4
    top_k: 8                             # VERIFIED §1.4
    n_moe_layers: 30                     # VERIFIED §1.4
    moe_layer_offset: 0
    hidden_dim: 2816                     # VERIFIED §1.4 (not 2048)
    moe_intermediate_size: 704
    # O1 REOPENED AND RE-CLOSED (T1.2 artifact + llama.cpp source, 2026-08-24). This read
    # `normalized+per_expert_scale`; the per-expert-scale half is WRONG. The tensor behind that
    # reading is `blk.N.ffn_gate_inp.scale`, and the audit shows it is **2816 = hidden_dim wide,
    # not 128 = n_experts**, so it cannot be a per-expert anything. src/models/gemma4.cpp:290-293
    # says what it actually is -- a scale on the router INPUT, applied before the router matmul:
    #     tmp = rms_norm(attn_out); tmp = tmp * (1/sqrt(n_embd)); tmp = tmp * ffn_gate_inp_s
    #     logits = ffn_gate_inp @ tmp
    # It is part of computing the logits, not a transform applied after top-k. What happens after
    # top-k is plain softmax renormalization over the selected experts (build_moe_ffn is called
    # with GATING_FUNC_TYPE_SOFTMAX and norm_w = true), which is exactly `normalized` -- the same
    # value Qwen3 carries. Gemma and Qwen3 are therefore post-topk-identical, which makes Pair T
    # cleaner than it was recorded as being.
    post_topk: normalized
    aux_loss: {key: null, value: null}   # absent from config
    # CORRECTED (T1.3): planning recorded shared_experts: 0 plus a parallel dense MLP. The published
    # architecture is "8 active / 128 total AND 1 shared" — an always-on expert, however llama.cpp
    # chooses to implement it. Either reading gives the same always-on capacity, so the consequences
    # below stand, but the count was wrong and 0 would have been used as a normalizer.
    #
    # Consequences, all of which already applied under the old reading:
    #   * the shared expert is deterministic, carries NO routing information, and is EXCLUDED from
    #     every entropy and MI quantity (same rule as DeepSeek's 2)
    #   * 128 is the routed count and therefore the normalizer; top_k 8 is over the routed experts
    #   * Pair T is not architecture-matched, and Gemma groups with DeepSeek wherever always-on
    #     capacity is discussed (§1.5, T9.3)
    # VERIFIED T1.2 (artifact) — no `ffn_gate_inp.bias` tensor exists in the GGUF, and gemma4.cpp
    # passes `nullptr` for exp_probs_b. Contrast GPT-OSS, whose bias IS present and is 32 = n_experts
    # wide. T1.3 should confirm against config.json, but a bias that is absent from both the weights
    # and the forward pass is not going to appear there.
    has_router_bias: false
    shared_experts: 1                    # VERIFIED T1.3 — was 0; see above
    parallel_dense_mlp: true             # VERIFIED §1.4 — may be the same always-on branch as above
    # RESOLVED from src/models/gemma4.cpp:283-317 (was `unresolved`, pending T1.4). llama.cpp
    # implements the always-on capacity as a **parallel dense MLP**, not as an always-selected
    # expert: `cur_mlp = build_ffn(ffn_norm_1, ffn_up/ffn_gate/ffn_down)` runs on the non-expert
    # tensors and is added to the MoE branch (`cur = cur_mlp + cur_moe`, cb'd `ffn_moe_combined`).
    # It never passes through the router and occupies no slot in the 128. Consequences are the ones
    # already recorded: it carries no routing information and is excluded from every entropy and MI
    # quantity, and 128 stays the normalizer. Unlike DeepSeek's shared experts, it is not even in
    # the expert tensors, so there is no index to exclude -- the exclusion is automatic here.
    shared_expert_implementation: parallel_dense_mlp
    # Router lives at model.language_model.layers[i].router — NOT .mlp (.mlp is the dense branch).
    # A hook on .mlp captures the wrong tensor.
    router_module_path: model.language_model.layers.{i}.router
    vocab_size: 262144
    max_position_embeddings: 262144      # ⇒ -c 2048 is MANDATORY or the KV cache OOMs a T4 (I4)
    multimodal: true                     # download the TEXT gguf only; skip mmproj-*
    approx_size_gb: 15.5
    device_plan: {n_gpu: 2, split_mode: layer, tensor_split: [0.5, 0.5]}
    config_keys: {experts: num_experts, top_k: top_k_experts, aux_loss: null, nesting: text_config}
    gguf: {repo: null, kaggle: ryzewtf/moe-panel/gguf/gemma-4-26b-a4b, file: gemma-4-26b-a4b-Q4_K_M.gguf, sha256: 17638a1f5721791fd56b5aec79124821560b3ed1f708c3dedd36c837ddd71a6e, size_bytes: 16795998784}
    # OUR CONVERSION (T1.1, 2026-08-24), replacing mradermacher's build this entry used to name.
    # Google publishes no first-party GGUF. This one needed transformers 5.15.1 to convert at all:
    # its tokenizer_config.json carries `extra_special_tokens` as a LIST, and 4.57.6 calls .keys()
    # on it. T1.3 (config verification against config.json) and T1.2 (router dtype) stay
    # load-bearing here — a converter new enough to be the only one that works is also the one
    # least covered by the rest of the panel's runs.
    # RESOLVED 2026-08-24 — option (a): llama.cpp is patched to name the tensor. The problem and
    # why the other two options were rejected are kept below, because the patch only makes sense to
    # someone who knows what it is for.
    #
    # `patches/gemma4-router-input-cb.patch` adds one line to src/models/gemma4.cpp:
    #     cb(tmp, "ffn_moe_router_input", il);
    # A ggml callback names an existing tensor. It creates no operation and changes no arithmetic,
    # so it cannot move any other model's numbers, and for Gemma it changes nothing that is
    # computed -- only what is visible. The patch is pinned by sha256 in
    # configs/run.yaml:build.llama_cpp_patches, which is inside run_config_sha256, so a tree that
    # is "the pinned commit plus this" does not hash as though it were the bare pinned commit.
    # setup applies it, verifies it, and refuses to build if it neither applies nor is already
    # applied.
    #
    # ORIGINAL PROBLEM — Gemma 4 routes off a tensor that llama.cpp never names.
    #
    # Every other architecture in the panel feeds the router the same normalized hidden state it
    # feeds the experts, cb'd as `ffn_norm`. Gemma 4 does not. src/models/gemma4.cpp:283-294 builds
    # TWO separate normalizations of `attn_out`:
    #   * `ffn_norm_2` = build_norm(attn_out, ffn_pre_norm_2)   -- cb'd, and feeds THE EXPERTS
    #   * `tmp`        = rms_norm(attn_out) * 1/sqrt(n_embd) * ffn_gate_inp_s -- NOT cb'd, and is
    #                    the tensor the router matmul actually consumes
    # The comment in the source says so outright: "router operates on attn_out, not cur".
    #
    # Why this is dangerous rather than merely awkward: `tmp` and `ffn_norm_2` are both [2816],
    # so T1.4's shape check CANNOT tell them apart. Wiring router_input to `ffn_norm_2` would pass
    # every gate the harness has and silently condition F4/F5/FV on a tensor the router never saw.
    # The failure would surface as an unexplained FV result for one model in a table of seven.
    # The generated spec currently predicts `ffn_norm-%d`, which does not exist in a Gemma MoE
    # layer at all -- so today T1.4 fails LOUDLY here, which is the safe state. Do not "fix" that
    # by substituting the nearest name that resolves.
    #
    # Three ways out, none of them free, decision required before Gemma collection:
    #   1. Patch llama.cpp to `cb(tmp, "ffn_moe_router_input", il)` and rebuild. Correct, and cheap
    #      in code, but it moves llama_cpp_commit off the pinned 7077abbe that every other trace in
    #      the study was collected under.
    #   2. Reconstruct the router input offline from `ffn_norm_2` -- impossible: ffn_pre_norm_2 and
    #      ffn_gate_inp_s are different learned vectors, so one is not a rescaling of the other.
    #   3. Drop F4/F5/FV for Gemma and say so. Costs the router-input arm of Pair T.
    # Recorded here rather than in the task list because the next person to touch this file needs
    # it before they touch node_names.
    #
    # NOT a hazard, checked: gemma4.cpp precomputes the logits and passes them into build_moe_ffn
    # as `probs_in`, which takes the `else` branch at llama-graph.cpp:1953 and does NOT re-cb.
    # `ffn_moe_logits` is therefore emitted exactly once per layer and T1.4's at-most-one half is
    # not at risk here.
    router_dtype: F32
    # router_input is `ffn_moe_router_input`, which exists only because
    # patches/gemma4-router-input-cb.patch adds it -- see the blocker note above and
    # configs/run.yaml:build.llama_cpp_patches. A session built without that patch will not find
    # this node, which is the intended behaviour: failing to resolve a name is loud, and capturing
    # `ffn_norm_2` instead would be silent and wrong.
    # VERIFIED by T1.4 (llama-eval-callback, commit 7077abbe14c5 + gemma4-router-input-cb.patch):
    # the scan CONFIRMED all three node names consistent across every one of the 30 MoE layers,
    # with router_input resolving to the patched callback tensor as intended.
    node_names: {logits: ffn_moe_probs-%d, logits_biased: null, topk: ffn_moe_topk-%d,
                 router_input: ffn_moe_router_input-%d}
    logit_tensor_used: ffn_moe_probs

# --- comparison structure (§1.5) ---------------------------------------------------------------
# None of these is a strictly controlled pair except Pair A. The framing matters in the write-up.
pairs:
  pair_g:
    members: [gpt-oss-20b, olmoe-0125]
    holds_fixed: [activated_density_12.5pct]
    not_matched: [post_training, quant_format, depth, attention, aux_loss_coef, expert_ffn_width,
                  vocabulary, pytorch_xval_coverage]
    framing: "matched density, with these differences documented"
    controls: [olmoe-0125-instruct]
  pair_t:
    members: [qwen3-30b-a3b, gemma-4-26b-a4b]
    holds_fixed: [n_routed_experts_128, top_k_8]
    not_matched: [gemma_parallel_dense_mlp, hidden_dim, expert_ffn_width, vocabulary, attention,
                  checkpoint_status]
    framing: "matched routed-expert count and top-k, across two independent training pipelines"
  pair_a:
    members: [olmoe-0924, olmoe-0125]
    holds_fixed: [architecture, tokenizer, vocabulary, checkpoint_status, aux_loss_coef]
    not_matched: [annealing_100B_tokens]
    framing: "genuinely controlled; the only pair where F1 conditions on an identical variable"
